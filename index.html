<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookbook</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <button id="displayBtn">Display: Light</button>
    <button id="sortBtn">Sort by: Category</button>
    <button id="filterBtn">Filter Tags</button>
  </div>

  <!-- SINGLE TITLE ONLY -->
  <h1 class="page-title">Cookbook</h1>

  <!-- SEARCH BAR -->
  <div class="controls">
    <input
      id="search"
      type="text"
      placeholder="Search recipes..."
    >
  </div>

  <!-- TAG FILTER PANEL -->
  <div id="tagPanel" hidden></div>

  <!-- RECIPE LIST -->
  <div id="app"></div>

  <!-- DISPLAY TOGGLE -->
  <script>
    function initDisplayToggle() {
      const btn = document.getElementById("displayBtn");
      if (!btn) return;

      let mode = localStorage.getItem("displayMode") || "light";

      function applyMode(m) {
        if (m === "dark") {
          document.body.classList.add("dark-mode");
          btn.textContent = "Display: Dark";
        } else {
          document.body.classList.remove("dark-mode");
          btn.textContent = "Display: Light";
        }
      }

      applyMode(mode);

      btn.addEventListener("click", () => {
        mode = document.body.classList.contains("dark-mode") ? "light" : "dark";
        localStorage.setItem("displayMode", mode);
        applyMode(mode);
      });
    }

    initDisplayToggle();
  </script>

  <script src="app.js"></script>

</body>
</html>
